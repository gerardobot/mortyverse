[versions]
android-gradle-plugin = "9.1.0"
coil = "2.7.0"
compose-bom = "2026.03.00"
compose-activity = "1.13.0"
compose-navigation = "2.9.7"
chucker = "4.3.1"
kotlin = "2.3.10"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.10.0"
koin-bom = "4.1.1"
ktlint = "14.2.0"
retrofit = "3.0.0"
agp = "9.1.0"

[libraries]
## Build Logic ##
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

## Implementation ##
# Coil
coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "compose-activity" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "compose-navigation" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui = { module = "androidx.compose.ui:ui" }

# Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

# Kotlinx
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

## Debug ##
# Chucker
debug-chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }

# Compose
debug-compose-tooling = { module = "androidx.compose.ui:ui-tooling" }

## Release ##
#Chucker
release-chucker = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chucker" }

[plugins]
mortyverse-android-application = { id = "mortyverse.android.application" }
mortyverse-app = { id = "mortyverse.app" }
mortyverse-ui = { id = "mortyverse.ui" }
mortyverse-domain = { id = "mortyverse.domain" }
mortyverse-data = { id = "mortyverse.data" }
mortyverse-infra = { id = "mortyverse.infra" }
mortyverse-koin = { id = "mortyverse.koin" }
mortyverse-koin-compose = { id = "mortyverse.koin.compose" }
mortyverse-compose = { id = "mortyverse.compose" }
mortyverse-compose-ui = { id = "mortyverse.compose.ui" }
mortyverse-compose-app = { id = "mortyverse.compose.app" }
mortyverse-retrofit-serialization = { id = "mortyverse.retrofit.serialization" }
mortyverse-android-library = { id = "mortyverse.android.library" }
mortyverse-android-ui = { id = "mortyverse.android.ui" }
mortyverse-kotlin-library = { id = "mortyverse.kotlin.library" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
android-library = { id = "com.android.library", version.ref = "agp" }

